<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles.css">
    <title>Contacto</title>
</head>
<body>
    <header class="header-contenedor">
        <div>
            <img src="/img/logo.png" alt="">
        </div>
        <nav>
            <ul>
                <li><a href="/index.html">Inicio</a></li>
                <li><a href="">¿Quienees somos?</a></li>
                <li><a href="/productos.html">Productos</a></li>
            </ul>
        </nav>
    </header>
<main>
    <section id="contacto">

        <h1>Ingrese los datos y nos pondremos en contacto</h1>
        <form action="https://formspree.io/f/xanyjdqr" method="post">

        <label for="name">Nombre:</label>
        <input type="text" id="name" name="name" required placeholder="Tu nombre acá" minlength="5">

        <label for="email">Correo Electronico:</label>
        <input type="text" id="email" name="email" required placeholder="Tu email aca" minlength="5">

        <label for="mensaje" >Mensaje:</label>
        <textarea type="text" id="mensaje" name="mensaje" required placeholder="Tu mensaje aca" minlength="15"> </textarea>

        <button type="submit">Enviar</button>

        </form>
        

    </section>
</main>
</body>
</html>
